name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version

      - name: Scan all available Git history
        shell: bash
        env:
          REVIEWED_IGNORE_SHA256: "b5fb50bfb488ab32bbaeb253d38c60ebf810ff95b0f720844497a93e74b8fa44"
        run: |
          set -euo pipefail
          # Keep exceptions limited to the reviewed historical public identifiers.
          printf '%s  %s\n' "${REVIEWED_IGNORE_SHA256}" "${GITHUB_WORKSPACE}/.gitleaksignore" | sha256sum --check --strict
          # Do not load a repository-controlled .gitleaks.toml or allow comments.
          printf '[extend]\nuseDefault = true\n' > "${RUNNER_TEMP}/gitleaks-config.toml"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" git \
            --config="${RUNNER_TEMP}/gitleaks-config.toml" \
            --gitleaks-ignore-path="${GITHUB_WORKSPACE}/.gitleaksignore" \
            --ignore-gitleaks-allow \
            --log-opts="--all" \
            --redact=100 \
            --no-banner \
            --no-color \
            --exit-code=1 \
            .
